source [find interface/stlink.cfg]

transport select hla_swd

source [find target/stm32f4x.cfg]

# Use a software reset; hardware reset timed out with this connection.
reset_config none connect_deassert_srst

# Keep SWD slow throughout reset and programming. The target defaults raise
# it to 8 MHz in reset-init, so override both reset event handlers.
adapter speed 1000
$_TARGETNAME configure -event reset-start { adapter speed 1000 }
$_TARGETNAME configure -event reset-init { adapter speed 1000 }

# CLion supplies the program/reset/shutdown commands for Run and Debug.
# Its Run command omits verify, so enable readback verification by default.
rename program program_without_default_verify
proc program {filename args} {
    if {[lsearch -exact $args verify] < 0} {
        lappend args verify
    }
    return [eval [linsert $args 0 program_without_default_verify $filename]]
}
